<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таймер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Новогодний шарик -->
    <div class="ornament">
        <svg width="80" height="120" viewBox="0 0 80 120">
            <!-- Нитка -->
            <line x1="40" y1="0" x2="40" y2="20" stroke="#ffcc00" stroke-width="2"/>
            <!-- Крепление -->
            <rect x="35" y="20" width="10" height="8" fill="#ffcc00" rx="2"/>
            <!-- Шарик -->
            <circle cx="40" cy="70" r="35" fill="#ff00ff" stroke="#cc00cc" stroke-width="2"/>
            <!-- Блик -->
            <ellipse cx="28" cy="55" rx="10" ry="15" fill="rgba(255,255,255,0.4)"/>
            <!-- Имя -->
            <text x="40" y="78" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="Arial">Аня</text>
        </svg>
    </div>

    <!-- Гирлянда -->
    <div class="garland">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
        <div class="light blue"></div>
        <div class="light purple"></div>
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
        <div class="light blue"></div>
        <div class="light purple"></div>
    </div>

    <h1>До Нового года осталось:</h1>
    
    <button id="theme-btn" style="background: transparent; color: #ff00ff; border: 1px solid #ff00ff; padding: 10px 20px; border-radius: 50px; cursor: pointer; margin-bottom: 20px; box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);">Сменить тему 🌓</button>
    
    <div id="timer">
        <div class="block"><span id="days">0</span><p>дней 📅</p></div>
        <div class="block"><span id="hours">0</span><p>часов ⏰</p></div>
        <div class="block"><span id="minutes">0</span><p>минут ⏳</p></div>
        <div class="block"><span id="seconds">0</span><p>секунд ⚡</p></div>
    </div>

    <!-- НОВЫЙ БЛОК: Прогресс-бар года -->
    <div style="width: 80%; max-width: 400px; height: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; margin: 20px auto; overflow: hidden; border: 1px solid rgba(255, 0, 255, 0.3);">
        <div id="year-progress" style="height: 100%; width: 0%; background: linear-gradient(90deg, #ff00ff, #00ffff); transition: width 1s ease;"></div>
    </div>
    <p id="year-progress-text" style="color: #aaa; font-size: 14px; margin-top: 5px;"></p>

    <!-- Подпись со ссылкой на GitHub -->
    <p style="margin-top: 30px; color: #e0c8ff; font-size: 14px;">
        Сделано с ❤️ Аней, 2026 год | 
        <a href="https://github.com/kmvanyaa" target="_blank" style="color: #ff00ff; text-decoration: none;">Мой GitHub</a>
    </p>
    
    <p id="quote" style="font-style: italic; color: #e0c8ff; margin-top: 20px; font-size: 16px;"></p>
    
    <p id="current-time" style="color: #aaa; font-size: 14px; margin-top: 10px;"></p>
    <p id="current-date" style="color: #aaa; font-size: 14px; margin-top: 5px;"></p>
    
    <!-- Счётчик посещений -->
    <p id="visit-counter" style="color: #aaa; font-size: 14px; margin-top: 5px;"></p>
    
    <!-- Кнопка "Наверх" -->
    <button id="scrollTopBtn" title="Наверх">⬆</button>
    
    <script src="script.js"></script>
</body>
</html>
