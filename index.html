<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таймер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="garland">
    <div class="light red"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
    <div class="light blue"></div>
    <div class="light purple"></div>
    <div class="light red"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
    <div class="light blue"></div>
    <div class="light purple"></div>
</div>
    <h1>До Нового года осталось:</h1>
    
    <button id="theme-btn" style="background: transparent; color: #ff00ff; border: 1px solid #ff00ff; padding: 10px 20px; border-radius: 50px; cursor: pointer; margin-bottom: 20px; box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);">Сменить тему 🌓</button>
    
    <div id="timer">
        <div class="block"><span id="days">0</span><p>дней 📅</p></div>
        <div class="block"><span id="hours">0</span><p>часов ⏰</p></div>
        <div class="block"><span id="minutes">0</span><p>минут ⏳</p></div>
        <div class="block"><span id="seconds">0</span><p>секунд ⚡</p></div>
    </div>

    <!-- Подпись со ссылкой на GitHub -->
    <p style="margin-top: 30px; color: #e0c8ff; font-size: 14px;">
        Сделано с ❤️ Аней, 2026 год | 
        <a href="https://github.com/kmvanyaa" target="_blank" style="color: #ff00ff; text-decoration: none;">Мой GitHub</a>
    </p>
    
    <p id="quote" style="font-style: italic; color: #e0c8ff; margin-top: 20px; font-size: 16px;"></p>
    
    <p id="current-time" style="color: #aaa; font-size: 14px; margin-top: 10px;"></p>
    <p id="current-date" style="color: #aaa; font-size: 14px; margin-top: 5px;"></p>
    
    <!-- НОВАЯ СТРОЧКА: Счётчик посещений -->
    <p id="visit-counter" style="color: #aaa; font-size: 14px; margin-top: 5px;"></p>
    
    <script src="script.js"></script>
</body>
</html>
